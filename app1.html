<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NXT Media</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>:root{
  --bg:#04060c; --bg2:#070a13; --s1:#0a0e18; --s2:#101524; --s3:#171d2f;
  --line:rgba(150,170,215,.10); --line2:rgba(150,170,215,.18);
  --tx:#e9eefb; --mu:#8a94ab; --mu2:#5b6479;
  --ac:#2b7bff; --ac2:#5b9bff; --acs:rgba(43,123,255,.14); --acg:rgba(43,123,255,.35);
  --pos:#34d399; --neg:#ff5d73; --warn:#ffb648;
  --r1:22px; --r2:16px; --r3:12px;
  --side:236px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background-attachment:fixed;font-family:"Manrope",system-ui,sans-serif;background-image:radial-gradient(1200px 600px at 70% -10%,#0b1a3d 0%,transparent 60%);background-color:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .mu{color:var(--mu)} .ac{color:var(--ac2)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex-shrink:0;padding:26px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.logo{font-size:19px;font-weight:700;letter-spacing:-.02em;padding:0 10px}
.logo span{color:var(--ac)}
.hello{padding:0 10px}
.hello h1{font-size:24px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.hello h1 b{font-weight:700}
.hello p{color:var(--mu);font-size:12px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav small{color:var(--mu2);font-size:11px;padding:10px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--mu);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{color:var(--tx);background:var(--s2)}
.nav button[aria-current=page]{background:var(--ac);color:#fff;box-shadow:0 8px 24px -10px var(--acg)}
.nav svg{width:17px;height:17px;flex-shrink:0}
.side .foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--mu)}
.side .foot button{color:var(--mu);text-decoration:underline;font-size:12px;margin-top:6px}
.sync{display:flex;align-items:center;gap:7px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.sync.busy i{background:var(--warn)} .sync.err i{background:var(--neg)}

.main{flex:1;min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;min-width:220px}
.search input{background:none;border:0;outline:0;width:100%}
.search svg{width:15px;height:15px;color:var(--mu)}

/* ---------- pills ---------- */
.pills{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);color:var(--tx);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s}
.pill:hover{border-color:var(--mu)}
.pill.on,.pill.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.pill.pri:hover{background:var(--ac2);border-color:var(--ac2)}
.pill.sm{height:30px;padding:0 12px;font-size:12px}
.pill.danger{color:var(--neg);border-color:rgba(255,93,115,.35)}
.pill.danger:hover{background:rgba(255,93,115,.1)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:inline-grid;place-items:center;color:var(--tx)}
.icon:hover{border-color:var(--mu)}
.icon svg{width:16px;height:16px}

/* month picker */
.mpick{display:inline-flex;align-items:center;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px}
.mpick button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}
.mpick button:hover{background:var(--s3);color:var(--tx)}
.mpick select{appearance:none;background:transparent;border:0;outline:0;font-weight:600;padding:0 8px;text-align:center;cursor:pointer;min-width:118px}
.mpick select option,.mpick select optgroup{background:var(--s2)}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr)}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:1fr 1fr}
.card{background:linear-gradient(180deg,var(--s1),var(--bg2));border:1px solid var(--line);border-radius:var(--r1);padding:22px;min-width:0}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card .hd h3{margin-right:auto}
.card .hd .sub{color:var(--mu);font-size:12px;font-weight:400}
.mb{margin-bottom:16px}

/* hero: caja */
.cash{position:relative;overflow:hidden;background:radial-gradient(500px 260px at 0% 0%,rgba(43,123,255,.22),transparent 70%),linear-gradient(180deg,#0b1222,#070a13)}
.cash .lbl{color:var(--mu);font-size:13px}
.cash .big{font-size:46px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:10px 0 4px}
.cash .big small{font-size:22px;color:var(--mu);font-weight:500}
.split{height:10px;border-radius:999px;background:var(--s3);overflow:hidden;display:flex;margin:18px 0 12px}
.split i{display:block;height:100%}
.split .a{background:repeating-linear-gradient(135deg,#3a4560 0 6px,#2b3448 6px 12px)}
.split .b{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend b{font-size:16px;font-weight:600}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.cash .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.alert{margin-top:14px;padding:10px 12px;border-radius:var(--r3);background:rgba(255,93,115,.08);border:1px solid rgba(255,93,115,.25);color:#ffc1ca;font-size:12.5px}
.note{margin-top:14px;padding:10px 12px;border-radius:var(--r3);background:var(--acs);border:1px solid rgba(43,123,255,.3);color:#c9dbff;font-size:12.5px}

/* tiles (like portfolio cards) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:var(--r2);padding:14px;min-width:0}
.tile .t{color:var(--mu);font-size:12px}
.tile .v{font-size:21px;font-weight:600;margin:6px 0 4px;letter-spacing:-.02em}
.tile .d{font-size:11.5px}
.tile.hl{background:linear-gradient(180deg,rgba(43,123,255,.18),rgba(43,123,255,.04));border-color:rgba(43,123,255,.35)}

.chart{position:relative;height:270px}
.chart.sm{height:200px}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--mu);font-size:12px}
.row.click{cursor:pointer;border-radius:12px;transition:background .12s}
.row.click:hover{background:var(--s2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--s3);color:var(--mu);white-space:nowrap}
.tag.ac{background:var(--acs);color:var(--ac2)} .tag.pos{background:rgba(52,211,153,.12);color:var(--pos)} .tag.neg{background:rgba(255,93,115,.12);color:var(--neg)} .tag.warn{background:rgba(255,182,72,.12);color:var(--warn)}
.empty{color:var(--mu);text-align:center;padding:26px 10px;font-size:13px}
.right{text-align:right}
.bar{height:5px;border-radius:999px;background:var(--s3);overflow:hidden;margin-top:6px;width:100%}
.bar i{display:block;height:100%;background:var(--ac);border-radius:999px}
.bar.pos i{background:var(--pos)} .bar.warn i{background:var(--warn)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--mu);font-weight:500;font-size:12px;text-align:left;padding:0 10px 10px;white-space:nowrap}
table.t td{padding:11px 10px;border-top:1px solid var(--line);white-space:nowrap}
table.t tr.cur td{background:var(--acs)}
table.t tr.cur td:first-child{border-radius:10px 0 0 10px} table.t tr.cur td:last-child{border-radius:0 10px 10px 0}
table.t .r{text-align:right}
.scroll{overflow-x:auto}

/* stepper */
.step{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;height:28px}
.step button{width:26px;height:26px;color:var(--mu);font-size:15px}
.step button:hover{color:var(--tx)}
.step span{min-width:44px;text-align:center;font-size:12px;font-weight:600}

/* ---------- overlay: modal + drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(2,4,9,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line2);border-radius:var(--r1);padding:24px;box-shadow:0 40px 80px -30px #000}
.modal.wide{width:min(720px,100%)}
.modal h3{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.modal .lead{color:var(--mu);font-size:13px;margin-bottom:18px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--s1);border-left:1px solid var(--line2);z-index:40;overflow:auto;padding:24px;box-shadow:-30px 0 60px -30px #000;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}*{transition:none!important}}
.dh{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.dh .grow{flex:1}
.dh h3{font-size:20px;font-weight:600;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.kv div{background:var(--s2);border-radius:var(--r3);padding:11px 12px}
.kv span{display:block;color:var(--mu);font-size:11.5px}
.kv b{font-size:16px;font-weight:600}
.sec{margin-top:20px}
.sec h4{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec h4 .pill{margin-left:auto}
.per{background:var(--s2);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px}
.per .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cost{display:flex;align-items:center;gap:10px;padding:8px 0 0;font-size:13px;flex-wrap:wrap}
.cost .grow{flex:1;min-width:120px}

/* forms */
.f{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mu)}
.in{height:42px;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r3);padding:0 12px;color:var(--tx);outline:0;width:100%}
textarea.in{height:auto;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--ac)}
select.in option{background:var(--s2)}
.hint{font-size:12px;color:var(--mu2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--mu)}
.chip.on{background:var(--acs);border-color:rgba(43,123,255,.5);color:var(--ac2)}
.team{display:grid;gap:8px}
.team .tr{display:grid;grid-template-columns:1.5fr .9fr .9fr 1fr 36px;gap:8px;align-items:center}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.btns .left{margin-right:auto}
.err{color:var(--neg);font-size:12.5px;min-height:1em}
input[type=range]{accent-color:var(--ac);width:100%}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line2);padding:12px 18px;border-radius:999px;z-index:90;font-size:13px;box-shadow:0 20px 40px -20px #000}
.toast.err{border-color:rgba(255,93,115,.5)}

/* menu */
.menu{position:fixed;z-index:60;background:var(--s2);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:180px;box-shadow:0 20px 40px -15px #000}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:13px}
.menu button:hover{background:var(--s3)}
.menu button.neg{color:var(--neg)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:min(400px,100%)}
.login .logo{font-size:26px;padding:0;margin-bottom:6px}
.login p{color:var(--mu);margin-bottom:24px}

/* ---------- responsive ---------- */
@media (max-width:1150px){.g-hero,.g-2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;width:auto;flex-direction:row;padding:8px;z-index:30;background:rgba(7,10,19,.96);border-right:0;border-top:1px solid var(--line);backdrop-filter:blur(10px)}
  .side .logo,.side .hello,.side .foot,.nav small{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 8px}
  .main{padding:16px 16px 100px}
  .g-2e,.kv{grid-template-columns:1fr 1fr}
  .search{min-width:0;flex:1}
  .cash .big{font-size:38px}
  .f2,.f3{grid-template-columns:1fr}
  .team .tr{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){.g-2e{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.hide-sm{display:none}}

.dback{position:fixed;inset:0;background:rgba(2,4,9,.55);z-index:39}
.modal .btns{position:sticky;bottom:-24px;background:var(--s1);padding:14px 0 4px;margin-bottom:-4px}
@media (max-width:820px){.top h2{flex:1}.top .search{order:4;flex-basis:100%}.top .pill.pri{order:2}.top .mpick{order:3;flex:1;justify-content:space-between}.mpick select{flex:1}}

body.ocupado button[type=submit],body.ocupado .modal .pill.pri,body.ocupado .modal .pill.danger{opacity:.55;pointer-events:none}
body.ocupado{cursor:progress}
</style>

<script>/* NXT Media — motor de cálculo.
   Todas las pantallas leen los números de acá; ninguna calcula por su cuenta. */
(function (root) {
  const r2 = n => Math.round((+n || 0) * 100) / 100;
  const sum = (arr, f) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
  const mesDe = fecha => String(fecha).slice(0, 7);

  function addMonths(mes, k) {
    const [y, m] = mes.split('-').map(Number);
    const t = y * 12 + (m - 1) + k;
    return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
  }
  function mesActual(d = new Date()) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function split(total, n) {
    const base = Math.round((total / n) * 100) / 100;
    const out = Array(n).fill(base);
    out[n - 1] = r2(total - base * (n - 1));
    return out;
  }

  /* Índices para no recorrer listas en cada consulta */
  function indexar(db) {
    const by = (arr, k) => { const m = new Map(); for (const x of arr) { if (!m.has(x[k])) m.set(x[k], []); m.get(x[k]).push(x); } return m; };
    const id = arr => new Map(arr.map(x => [x.id, x]));
    return {
      db,
      cliente: id(db.clientes), persona: id(db.equipo), contrato: id(db.contratos), periodo: id(db.periodos), costo: id(db.costos),
      periodosDeContrato: by(db.periodos, 'contrato_id'),
      periodosDeMes: by(db.periodos, 'mes'),
      costosDePeriodo: by(db.costos, 'periodo_id'),
      pagosDeCosto: by(db.pagos, 'costo_id'),
      cobrosDeContrato: by(db.cobros, 'contrato_id'),
    };
  }

  const pagadoCosto = (ix, costoId) => r2(sum(ix.pagosDeCosto.get(costoId) || [], p => p.monto));
  const restaCosto = (ix, c) => r2(c.monto - pagadoCosto(ix, c.id));

  function gastosDelMes(db, mes) {
    return db.gastos.filter(g => g.recurrente
      ? g.mes <= mes && (!g.hasta || mes <= g.hasta)
      : g.mes === mes);
  }

  /* Resultado económico de un mes (lo devengado: el trabajo de ese mes) */
  function mes(ix, m) {
    const db = ix.db;
    const pers = ix.periodosDeMes.get(m) || [];
    const costos = pers.flatMap(p => ix.costosDePeriodo.get(p.id) || []);
    const gastos = gastosDelMes(db, m);
    const ingreso = r2(sum(pers, p => p.ingreso));
    const costoEquipo = r2(sum(costos, c => c.monto));
    const totalGastos = r2(sum(gastos, g => g.monto));
    const ganancia = r2(ingreso - costoEquipo - totalGastos);
    const clientes = new Set(pers.map(p => ix.contrato.get(p.contrato_id)?.cliente_id));
    return {
      mes: m, ingreso, costoEquipo, gastos: totalGastos, ganancia,
      margen: ingreso > 0 ? ganancia / ingreso : 0,
      videos: sum(pers, p => p.videos),
      entregados: sum(pers, p => p.entregados || 0),
      periodos: pers.length, clientes: clientes.size,
      deudaEquipo: r2(sum(costos, c => Math.max(0, restaCosto(ix, c)))),
      cobrado: r2(sum(db.cobros.filter(c => mesDe(c.fecha) === m), c => c.monto)),
      pagadoEquipo: r2(sum(db.pagos.filter(p => mesDe(p.fecha) === m), p => p.monto)),
      retirado: r2(sum(db.retiros.filter(x => mesDe(x.fecha) === m), x => x.monto)),
      listaGastos: gastos,
    };
  }

  /* Estado de un contrato */
  function contrato(ix, c) {
    const pers = (ix.periodosDeContrato.get(c.id) || []).slice().sort((a, b) => a.mes.localeCompare(b.mes));
    const cobrado = r2(sum(ix.cobrosDeContrato.get(c.id) || [], x => x.monto));
    const costos = pers.flatMap(p => ix.costosDePeriodo.get(p.id) || []);
    const costoTotal = r2(sum(costos, x => x.monto));
    const pagado = r2(sum(costos, x => pagadoCosto(ix, x.id)));
    return {
      periodos: pers, cobrado, pendienteCobro: r2(c.precio_total - cobrado),
      costoTotal, pagadoEquipo: pagado, deudaEquipo: r2(costoTotal - pagado),
      ganancia: r2(c.precio_total - costoTotal),
      mesFin: addMonths(c.mes_inicio, c.meses - 1),
      cliente: ix.cliente.get(c.cliente_id),
    };
  }

  /* Caja: la plata que tiene el negocio hoy, más lo que hay que reservar */
  function caja(ix, hoy = new Date()) {
    const db = ix.db, actual = mesActual(hoy);
    const iso = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
    const hasta = f => String(f) <= iso;
    const cobros = r2(sum(db.cobros.filter(x => hasta(x.fecha)), x => x.monto));
    const pagos = r2(sum(db.pagos.filter(x => hasta(x.fecha)), x => x.monto));
    const retiros = r2(sum(db.retiros.filter(x => hasta(x.fecha)), x => x.monto));
    const ajustes = r2(sum(db.ajustes_caja.filter(x => hasta(x.fecha)), x => x.monto));
    const meses = new Set(db.gastos.map(g => g.mes));
    db.periodos.forEach(p => meses.add(p.mes));
    let gastos = 0;
    // gastos variables hasta este mes + recurrentes por cada mes transcurrido
    for (const g of db.gastos) {
      if (!g.recurrente) { if (g.mes <= actual) gastos += +g.monto; continue; }
      let m = g.mes;
      const fin = g.hasta && g.hasta < actual ? g.hasta : actual;
      while (m <= fin) { gastos += +g.monto; m = addMonths(m, 1); }
    }
    gastos = r2(gastos);
    const saldo = r2(ajustes + cobros - pagos - gastos - retiros);

    // Lo que se le debe al equipo: ya trabajado (hasta este mes) y futuro
    let deudaVencida = 0, deudaFutura = 0;
    for (const c of db.costos) {
      const resta = restaCosto(ix, c);
      if (resta <= 0) continue;
      const p = ix.periodo.get(c.periodo_id);
      if (p && p.mes > actual) deudaFutura += resta; else deudaVencida += resta;
    }
    deudaVencida = r2(deudaVencida); deudaFutura = r2(deudaFutura);
    const reserva = r2(deudaVencida + deudaFutura);
    const libre = r2(saldo - reserva);
    return {
      saldo, cobros, pagos, gastos, retiros, ajustes,
      deudaVencida, deudaFutura, reserva,
      disponible: Math.max(0, libre),
      faltante: libre < 0 ? r2(-libre) : 0,
    };
  }

  /* Plata que falta cobrar a clientes */
  function porCobrar(ix) {
    return ix.db.contratos.map(c => ({ c, e: contrato(ix, c) }))
      .filter(x => x.e.pendienteCobro > 0.009)
      .sort((a, b) => a.c.mes_inicio.localeCompare(b.c.mes_inicio));
  }

  /* Renovaciones: clientes activos el mes anterior que no tienen nada este mes */
  function renovaciones(ix, m) {
    const ant = addMonths(m, -1);
    const cli = mm => new Set((ix.periodosDeMes.get(mm) || []).map(p => ix.contrato.get(p.contrato_id)?.cliente_id));
    const prev = cli(ant), cur = cli(m);
    const noRenovaron = [...prev].filter(id => !cur.has(id)).map(id => ix.cliente.get(id)).filter(Boolean);
    const nuevos = [...cur].filter(id => !prev.has(id)).map(id => ix.cliente.get(id)).filter(Boolean);
    const terminan = ix.db.contratos.filter(c => addMonths(c.mes_inicio, c.meses - 1) === m)
      .filter(c => !ix.db.contratos.some(o => o.cliente_id === c.cliente_id && o.mes_inicio > m))
      .map(c => ix.cliente.get(c.cliente_id)).filter(Boolean)
      .filter((c, i, a) => a.indexOf(c) === i);
    return { anterior: prev.size, actual: cur.size, noRenovaron, nuevos, terminanSinRenovar: terminan,
      retencion: prev.size ? (prev.size - noRenovaron.length) / prev.size : null };
  }

  /* Métricas por cliente y por persona del equipo */
  function kpis(ix, desde, hasta) {
    const db = ix.db;
    const pers = db.periodos.filter(p => p.mes >= desde && p.mes <= hasta);
    // por cliente
    const porCliente = new Map();
    for (const c of db.contratos) {
      const cl = porCliente.get(c.cliente_id) || { cliente: ix.cliente.get(c.cliente_id), ingreso: 0, meses: new Set() };
      for (const p of ix.periodosDeContrato.get(c.id) || []) { cl.ingreso += +p.ingreso; cl.meses.add(p.mes); }
      porCliente.set(c.cliente_id, cl);
    }
    const clientes = [...porCliente.values()].map(x => ({ ...x, ingreso: r2(x.ingreso), meses: x.meses.size }));
    const ltv = clientes.length ? r2(sum(clientes, x => x.ingreso) / clientes.length) : 0;
    const vida = clientes.length ? sum(clientes, x => x.meses) / clientes.length : 0;
    // por persona (ingreso del periodo repartido entre quienes trabajaron en él)
    const porPersona = new Map();
    for (const p of pers) {
      const cs = ix.costosDePeriodo.get(p.id) || [];
      const total = sum(cs, c => c.monto) || 1;
      for (const c of cs) {
        const x = porPersona.get(c.persona_id) || { persona: ix.persona.get(c.persona_id), costo: 0, ingreso: 0, videos: 0, entregados: 0, trabajos: 0 };
        x.costo += +c.monto; x.ingreso += p.ingreso * (c.monto / total); x.trabajos++;
        if (c.rol === 'editor') { x.videos += p.videos; x.entregados += p.entregados || 0; }
        porPersona.set(c.persona_id, x);
      }
    }
    const equipo = [...porPersona.values()].map(x => ({ ...x, costo: r2(x.costo), ingreso: r2(x.ingreso),
      margen: x.ingreso ? 1 - x.costo / x.ingreso : 0, costoVideo: x.videos ? x.costo / x.videos : 0 }))
      .sort((a, b) => b.ingreso - a.ingreso);
    // canales
    const canales = {};
    for (const cl of clientes) { const o = cl.cliente?.origen || 'sin'; canales[o] = canales[o] || { clientes: 0, ingreso: 0 }; canales[o].clientes++; canales[o].ingreso += cl.ingreso; }
    return { ltv, vidaMeses: vida, ticket: pers.length ? r2(sum(pers, p => p.ingreso) / pers.length) : 0,
      clientes: clientes.sort((a, b) => b.ingreso - a.ingreso), equipo, canales };
  }

  /* Genera los periodos y costos de un contrato a partir de su configuración.
     Devuelve la forma deseada; la capa de datos la compara contra lo guardado. */
  function planContrato(c) {
    const ingresos = split(+c.precio_total || 0, c.meses);
    const periodos = [];
    for (let k = 0; k < c.meses; k++) periodos.push({ mes: addMonths(c.mes_inicio, k), n: k + 1, videos: +c.videos_por_mes || 0, ingreso: ingresos[k], costos: [] });
    for (const e of c.equipo || []) {
      const monto = +e.monto || 0;
      if (monto <= 0 || !e.persona_id) continue;
      const montos = e.modo === 'mensual' ? split(monto, c.meses) : [monto, ...Array(c.meses - 1).fill(0)];
      montos.forEach((m, k) => { if (m > 0) periodos[k].costos.push({ persona_id: e.persona_id, rol: e.rol || 'editor', monto: m }); });
    }
    return periodos;
  }

  const api = { r2, sum, addMonths, mesActual, mesDe, split, indexar, mes, contrato, caja, porCobrar, renovaciones, kpis, planContrato, pagadoCosto, restaCosto, gastosDelMes };
  if (typeof module !== 'undefined') module.exports = api; else root.Calc = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

        <div><span><i class="dot" style="background:#3a4560"></i>Reservado para el equipo</span><b class="num">${fmt(k.reserva)}</b><span class="mu">${fmt(k.deudaVencida)} ya trabajado · ${fmt(k.deudaFutura)} de meses próximos</span></div>
        <div><span><i class="dot" style="background:var(--ac)"></i>Libre</span><b class="num">${fmt(k.disponible)}</b><span class="mu">Retirado este mes: ${fmt(C.mes(S.ix, C.mesActual()).retirado)}</span></div>
      </div>

  function tilesMes(m) {
    const a = C.mes(S.ix, m), b = C.mes(S.ix, C.addMonths(m, -1));
    const t = (lbl, v, d, hl) => `<div class="tile${hl ? ' hl' : ''}"><div class="t">${lbl}</div><div class="v num">${v}</div><div class="d">${d}</div></div>`;
    return `<div class="tiles">
      ${t('Ingreso', fmt(a.ingreso), delta(a.ingreso, b.ingreso))}

      ${t('Gastos', fmt(a.gastos), `<span class="mu">${a.listaGastos.length} cargados</span>`)}
      ${t('Ganancia', fmt(a.ganancia), `<span class="mu">Margen ${pct(a.margen)}</span>`, true)}
    </div>`;
  }
  function pInicio() {
    const m = S.mes, a = C.mes(S.ix, m), rv = C.renovaciones(S.ix, m);
    const porCobrar = C.porCobrar(S.ix); const totCobrar = C.sum(porCobrar, x => x.e.pendienteCobro);
    const k = C.caja(S.ix);
    const deudaPers = {};
    for (const c of S.db.costos) { const r = C.restaCosto(S.ix, c); const p = S.ix.periodo.get(c.periodo_id); if (r > 0 && p && p.mes <= C.mesActual()) deudaPers[c.persona_id] = (deudaPers[c.persona_id] || 0) + r; }
    const topDeuda = Object.entries(deudaPers).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([id, v]) => `${esc(S.ix.persona.get(+id)?.nombre)} ${fmt(v)}`).join(', ');
    const faltanVideos = a.videos - a.entregados;
    const items = [];
    if (k.deudaVencida > 0) items.push({ t: `Le debés ${fmt(k.deudaVencida)} al equipo por trabajo hecho`, s: topDeuda, a: 'go', p: 'equipo', v: 'todo' });
    if (totCobrar > 0) items.push({ t: `${fmt(totCobrar)} por cobrar a ${porCobrar.length} cliente${porCobrar.length > 1 ? 's' : ''}`, s: porCobrar.slice(0, 3).map(x => esc(x.e.cliente?.nombre)).join(', '), a: 'go', p: 'finanzas' });
    if (rv.terminanSinRenovar.length) items.push({ t: `${rv.terminanSinRenovar.length} cliente${rv.terminanSinRenovar.length > 1 ? 's terminan' : ' termina'} en ${MESES[+m.slice(5) - 1]} sin renovar`, s: rv.terminanSinRenovar.slice(0, 4).map(c => esc(c.nombre)).join(', '), a: 'go', p: 'kpis' });
    if (faltanVideos > 0 && m <= C.mesActual()) items.push({ t: `${faltanVideos} videos sin entregar en ${MESES[+m.slice(5) - 1]}`, s: `${a.entregados} de ${a.videos} entregados`, a: 'go', p: 'clientes' });
    return `
    <div class="grid g-hero mb">${cajaCard()}
      <section class="card"><div class="hd"><h3>${mesLargo(m)}</h3><span class="sub">${a.clientes} clientes · ${a.videos} videos</span></div>${tilesMes(m)}
        <div class="chart sm" style="margin-top:16px"><canvas id="chMini" aria-label="Ingreso y ganancia por mes"></canvas></div>

        <div class="list">${items.length ? items.map(i => `<button class="row click" data-a="${i.a}" data-p="${i.p}"${i.v ? ` data-v="${i.v}"` : ''} style="text-align:left;width:100%"><div class="grow"><div class="ttl">${i.t}</div><div class="sub">${i.s || ''}</div></div>${ic('der', 2).replace('<svg', '<svg width="16" height="16"')}</button>`).join('') : '<div class="empty">Todo al día.</div>'}</div>
      </section>
      <section class="card"><div class="hd"><h3>Renovaciones</h3><span class="sub">${rv.retencion == null ? '' : 'Retención ' + pct(rv.retencion)}</span></div>
        ${listaClientesMini(rv.terminanSinRenovar, 'Ningún contrato termina este mes sin renovar.', 'Termina este mes', 6)}
      </section>
    </div>`;
  }
  function listaClientesMini(arr, vacio, sub, tope = 0) {
    if (!arr.length) return `<div class="empty">${vacio}</div>`;
    const resto = tope && arr.length > tope ? arr.length - tope : 0; if (resto) arr = arr.slice(0, tope);
    return `<div class="list">${arr.map(c => `<div class="row">${av(c.nombre, 30)}<div class="grow"><div class="ttl">${esc(c.nombre)}</div><div class="sub">${sub}</div></div></div>`).join('')}${resto ? `<button class="row click" data-a="go" data-p="kpis" style="width:100%;text-align:left"><div class="grow ac">Ver ${resto} más</div></button>` : ''}</div>`;
  }
  function chartInicio() {
    const el = $('#chMini'); if (!el || !window.Chart) return;
    const ms = []; for (let k = 5; k >= 0; k--) ms.push(C.addMonths(S.mes, -k));
    const d = ms.map(m => C.mes(S.ix, m));
    const ctx = el.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 200); g.addColorStop(0, 'rgba(43,123,255,.45)'); g.addColorStop(1, 'rgba(43,123,255,0)');
    S.charts.mini = new Chart(el, {
      type: 'line',
      data: { labels: ms.map(mesCorto), datasets: [
        { label: 'Ganancia', data: d.map(x => x.ganancia), borderColor: '#2b7bff', backgroundColor: g, fill: true, tension: .4, pointRadius: ms.map(m => m === S.mes ? 5 : 0), pointBackgroundColor: '#2b7bff', borderWidth: 2.2 },
        { label: 'Ingreso', data: d.map(x => x.ingreso), borderColor: 'rgba(150,170,215,.45)', borderDash: [4, 4], fill: false, tension: .4, pointRadius: 0, borderWidth: 1.5 }] },
      options: chartOpts(),
    });
  }
  function chartOpts() {
    return { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: true, align: 'end', labels: { color: '#8a94ab', boxWidth: 10, boxHeight: 2, font: { family: 'Manrope, system-ui, sans-serif', size: 11 } } },
        tooltip: { backgroundColor: '#171d2f', borderColor: 'rgba(150,170,215,.18)', borderWidth: 1, titleColor: '#e9eefb', bodyColor: '#e9eefb', padding: 10, callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } } },
      scales: { x: { grid: { display: false }, ticks: { color: '#5b6479', font: { family: 'Manrope, system-ui, sans-serif', size: 11 } }, border: { display: false } },
        y: { grid: { color: 'rgba(150,170,215,.07)' }, ticks: { color: '#5b6479', font: { family: 'Manrope, system-ui, sans-serif', size: 11 }, callback: v => '$' + (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v) }, border: { display: false } } } };
  }

  /* ---------- CLIENTES ---------- */
  function periodosDelMes() {
    const q = S.q.trim().toLowerCase();
    return (S.ix.periodosDeMes.get(S.mes) || []).map(p => {
      const c = S.ix.contrato.get(p.contrato_id); const e = C.contrato(S.ix, c);
      const costos = S.ix.costosDePeriodo.get(p.id) || [];
      const gente = [...new Set(costos.map(x => S.ix.persona.get(x.persona_id)?.nombre).filter(Boolean))];
      if (!gente.length) (c.equipo || []).forEach(x => { const n = S.ix.persona.get(x.persona_id)?.nombre; if (n && !gente.includes(n)) gente.push(n); });
      return { p, c, e, gente };
    }).filter(x => S.tabCli === 'todos' || x.c.tipo === S.tabCli)
      .filter(x => !q || x.e.cliente?.nombre.toLowerCase().includes(q) || x.gente.some(g => g.toLowerCase().includes(q)))
      .sort((a, b) => b.p.ingreso - a.p.ingreso);
  }
  function pClientes() {
    const rows = periodosDelMes(); const a = C.mes(S.ix, S.mes);
    const pend = rows.reduce((s, x) => s + Math.max(0, x.e.pendienteCobro), 0);
    const t = (l, v, d) => `<div class="tile"><div class="t">${l}</div><div class="v num">${v}</div><div class="d mu">${d}</div></div>`;
    return `
    <div class="tiles mb">${t('Clientes', a.clientes, mesLargo(S.mes))}${t('Videos entregados', `${a.entregados}<span class="mu" style="font-size:15px"> / ${a.videos}</span>`, a.videos ? pct(a.entregados / a.videos) + ' del total' : '—')}${t('Ingreso del mes', fmt(a.ingreso), 'Repartido por mes')}${t('Por cobrar', fmt(pend), 'De estos contratos')}</div>
    <section class="card">
      <div class="hd"><div class="pills">${[['todos', 'Todos'], ['edicion', 'Edición'], ['contenido', 'Contenido']].map(([v, l]) => `<button class="pill sm${S.tabCli === v ? ' on' : ''}" data-a="tabcli" data-v="${v}">${l}</button>`).join('')}</div><span class="sub" style="margin-left:auto">${rows.length} en ${mesLargo(S.mes)}</span></div>
      <div class="list">${rows.length ? rows.map(filaCliente).join('') : `<div class="empty">${S.q ? 'Nadie coincide con la búsqueda.' : `No hay clientes en ${mesLargo(S.mes)}. Cargá uno con “Nuevo cliente”.`}</div>`}</div>
    </section>`;
  }
  function filaCliente({ p, c, e, gente }) {
    const nombre = e.cliente?.nombre || '—';
    const ent = p.entregados ?? 0; const prog = p.videos ? Math.min(100, ent / p.videos * 100) : 0;
    const cobro = e.pendienteCobro > 0.009 ? `<span class="tag warn">Falta ${fmt(e.pendienteCobro)}</span>` : '<span class="tag pos">Cobrado</span>';
    return `<div class="row click" data-a="ver" data-id="${c.id}">
      ${av(nombre)}
      <div class="grow"><div class="ttl">${esc(nombre)} ${c.meses > 1 ? `<span class="tag ac">Mes ${p.n} de ${c.meses}</span>` : ''} ${c.tipo === 'contenido' ? '<span class="tag">Contenido</span>' : ''}</div>
        <div class="sub">${esc(gente.join(', ') || 'Sin editor')}</div></div>
      <div style="width:150px" class="hide-sm" data-stop>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><span class="step"><button data-a="ent" data-p="${p.id}" data-d="-1" aria-label="Menos">−</button><span class="num">${ent}/${p.videos}</span><button data-a="ent" data-p="${p.id}" data-d="1" aria-label="Más">+</button></span></div>

      <button class="icon" data-a="menu" data-id="${c.id}" aria-label="Opciones">${ic('dots')}</button>
    </div>`;
  }

  /* ---------- detalle de contrato ---------- */

      ${c.drive ? `<div class="sec"><a class="pill sm" href="https://drive.google.com/drive/folders/${encodeURIComponent(c.drive)}" target="_blank" rel="noopener">Abrir carpeta de Drive</a></div>` : ''}
      ${c.notas ? `<div class="sec"><h4>Notas</h4><p class="mu">${esc(c.notas)}</p></div>` : ''}`;
  }
  function cerrarDrawer() { S.drawer = null; document.querySelectorAll('.drawer,.dback').forEach(d => d.remove()); }

  /* ---------- formulario de contrato ---------- */

    const base = prev ? { ...prev } : { tipo: 'edicion', mes_inicio: S.mes, meses: 1, videos_por_mes: 8, precio_total: '', servicios: ['Reels IG/TikTok'], drive: '', notas: '', equipo: [] };
    if (modo === 'renovar') { base.mes_inicio = C.addMonths(prev.mes_inicio, prev.meses); base.drive = ''; base.notas = ''; }

    modal(`<h3>${esc(titulo)}</h3><p class="lead">${modo === 'renovar' ? 'Se crea un contrato nuevo desde el mes siguiente. El anterior queda intacto.' : 'Cargalo una sola vez, aunque dure varios meses.'}</p>

        <label class="fl">Carpeta de Drive<input class="in" name="drive" placeholder="Link de la carpeta" value="${base.drive ? 'https://drive.google.com/drive/folders/' + esc(base.drive) : ''}"></label>

        <div class="btns"><button type="button" class="pill" data-a="cerrarModal">Cancelar</button><button class="pill pri" type="submit">${modo === 'editar' ? 'Guardar cambios' : modo === 'renovar' ? 'Renovar' : 'Guardar cliente'}</button></div>
      </form>
      <datalist id="dl-cli">${S.db.clientes.map(c => `<option value="${esc(c.nombre)}">`).join('')}</datalist>
      <datalist id="dl-eq">${S.db.equipo.filter(p => p.activo).map(p => `<option value="${esc(p.nombre)}">`).join('')}</datalist>`, m => {
      const f = m.querySelector('#fc'); let n = equipo.length;

        const meses = +f.meses.value, precio = +f.precio.value || 0;

        m.querySelector('#eqHint').textContent = meses > 1 ? '“Por mes”: el monto se reparte en los meses. “Pago único”: se le debe todo el primer mes.' : '';
      };

      m.querySelector('#addEq').addEventListener('click', () => { m.querySelector('#team').insertAdjacentHTML('beforeend', filaEq({ nombre: '', rol: 'editor', monto: '', modo: 'mensual' }, n++)); actualizar(); });
      m.querySelector('#team').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) b.closest('.tr').remove(); });
      f.addEventListener('submit', async e => {
        e.preventDefault(); const err = m.querySelector('#ferr'); err.textContent = '';

          cobro: f.cobro ? C.r2(+f.cobro.value || 0) : 0, fcobro: f.fcobro ? f.fcobro.value : hoyISO(),

        if (modo === 'nuevo' && S.db.contratos.some(c => S.ix.cliente.get(c.cliente_id)?.nombre.toLowerCase() === v.cliente.toLowerCase() && c.mes_inicio === v.mes) &&
          !(await confirmarEnLinea(err, `${v.cliente} ya tiene un contrato que empieza en ${mesLargo(v.mes)}. ¿Es otro proyecto distinto?`))) return;

      });

  function confirmarEnLinea(el, txt) {
    return new Promise(res => {
      el.innerHTML = `${esc(txt)} <button type="button" class="pill sm" data-y="1">Sí, guardar</button> <button type="button" class="pill sm" data-y="0">No</button>`;
      el.addEventListener('click', function h(e) { const b = e.target.closest('[data-y]'); if (!b) return; el.removeEventListener('click', h); el.textContent = ''; res(b.dataset.y === '1'); });

  /* ---------- escritura: contratos ---------- */
  async function asegurarPersona(nombre, rol) {
    let p = S.db.equipo.find(x => x.nombre.toLowerCase() === nombre.toLowerCase());
    if (!p) { p = await DB.ins('equipo', { nombre, rol: rol === 'copy' ? 'copy' : 'editor' }); S.db.equipo.push(p); }
    return p;
  }
  async function guardarContrato(v, prev, modo) {
    let cli = S.db.clientes.find(x => x.nombre.toLowerCase() === v.cliente.toLowerCase());
    if (!cli) cli = await DB.ins('clientes', { nombre: v.cliente, origen: v.origen });
    else if ((cli.origen || '') !== v.origen) await DB.upd('clientes', cli.id, { origen: v.origen });
    const equipo = [];
    for (const e of v.equipo) { const p = await asegurarPersona(e.nombre, e.rol); equipo.push({ persona_id: p.id, rol: e.rol, monto: e.monto, modo: e.modo }); }
    const row = { cliente_id: cli.id, tipo: v.tipo, mes_inicio: v.mes, meses: v.meses, videos_por_mes: v.videos, precio_total: v.precio, servicios: v.servicios, drive: v.drive, notas: v.notas, equipo };
    if (modo === 'editar') return sincronizar(prev, row);
    if (modo === 'renovar') row.renovado_de = prev.id;
    const c = await DB.ins('contratos', row);
    const plan = C.planContrato(row);
    const pers = await DB.insMany('periodos', plan.map(p => ({ contrato_id: c.id, mes: p.mes, n: p.n, videos: p.videos, ingreso: p.ingreso })));
    const porMes = new Map(pers.map(p => [p.mes, p.id]));
    await DB.insMany('costos', plan.flatMap(p => p.costos.map(x => ({ ...x, periodo_id: porMes.get(p.mes) }))));
    if (v.cobro > 0) await DB.ins('cobros', { contrato_id: c.id, fecha: v.fcobro || hoyISO(), monto: v.cobro, nota: '' });
  }
  const eqKey = eq => JSON.stringify((eq || []).map(e => [e.persona_id, e.rol, +e.monto, e.modo]));
  const tienePagos = costoIds => costoIds.some(id => (S.ix.pagosDeCosto.get(id) || []).length);
  async function sincronizar(prev, row) {
    const plan = C.planContrato(row);
    const existentes = S.ix.periodosDeContrato.get(prev.id) || [];
    const porMes = new Map(existentes.map(p => [p.mes, p]));
    const estructura = prev.meses !== row.meses || prev.mes_inicio !== row.mes_inicio;
    const cambioPrecio = estructura || +prev.precio_total !== +row.precio_total || +prev.videos_por_mes !== +row.videos_por_mes;
    const cambioEquipo = estructura || eqKey(prev.equipo) !== eqKey(row.equipo);
    // 1) validar antes de escribir nada
    const quitar = existentes.filter(p => !plan.some(x => x.mes === p.mes));
    for (const p of quitar) if (tienePagos((S.ix.costosDePeriodo.get(p.id) || []).map(c => c.id)))
      throw new Error(`No se puede quitar ${mesLargo(p.mes)}: tiene pagos al equipo. Revertilos primero.`);
    const ops = [];
    for (const pp of plan) {
      const per = porMes.get(pp.mes);
      if (!per) { ops.push({ nuevo: pp }); continue; }
      const op = { per, upd: { n: pp.n }, costos: null };
      if (cambioPrecio) Object.assign(op.upd, { videos: pp.videos, ingreso: pp.ingreso });
      if (cambioEquipo) {
        const cs = S.ix.costosDePeriodo.get(per.id) || []; const usados = new Set(); op.costos = { upd: [], ins: [], del: [] };
        for (const dc of pp.costos) {
          const ex = cs.find(x => !usados.has(x.id) && x.persona_id === dc.persona_id && x.rol === dc.rol);
          if (ex) { usados.add(ex.id); if (+ex.monto !== dc.monto) op.costos.upd.push([ex.id, dc.monto]); }
          else op.costos.ins.push({ ...dc, periodo_id: per.id });
        }
        op.costos.del = cs.filter(x => !usados.has(x.id));
        const conPago = op.costos.del.find(x => tienePagos([x.id]));
        if (conPago) throw new Error(`${S.ix.persona.get(conPago.persona_id)?.nombre} ya cobró algo de ${mesLargo(per.mes)}. Revertí ese pago antes de sacarlo del contrato.`);
      }
      ops.push(op);
    }
    // 2) escribir
    await DB.upd('contratos', prev.id, row);
    await DB.delIn('periodos', quitar.map(p => p.id));
    for (const op of ops) {
      if (op.nuevo) {
        const per = await DB.ins('periodos', { contrato_id: prev.id, mes: op.nuevo.mes, n: op.nuevo.n, videos: op.nuevo.videos, ingreso: op.nuevo.ingreso });
        await DB.insMany('costos', op.nuevo.costos.map(x => ({ ...x, periodo_id: per.id })));
        continue;
      }
      await DB.upd('periodos', op.per.id, op.upd);
      if (op.costos) {
        for (const [id, monto] of op.costos.upd) await DB.upd('costos', id, { monto });
        await DB.insMany('costos', op.costos.ins);
        await DB.delIn('costos', op.costos.del.map(x => x.id));
      }
    }
  }
  async function eliminarContrato(id) {
    const c = S.ix.contrato.get(id); const e = C.contrato(S.ix, c);
    const extra = (e.cobrado || e.pagadoEquipo) ? `<br><br>También se borran ${fmt2(e.cobrado)} de cobros y ${fmt2(e.pagadoEquipo)} de pagos al equipo, y la caja se recalcula.` : '';
    if (!(await confirmar(`¿Eliminar el contrato de ${e.cliente?.nombre}?`, `Se borran sus ${c.meses} mes${c.meses > 1 ? 'es' : ''}.${extra} No se puede deshacer.`, 'Eliminar', true))) return;
    cerrarDrawer();

      ${resta > 0.009 ? `<form class="f" id="fp">

      ${resta <= 0.009 ? '<div class="btns"><button class="pill" data-a="cerrarModal">Cerrar</button></div>' : ''}`, m => {

  /* ---------- EQUIPO ---------- */
  function pEquipo() {
    const q = S.q.trim().toLowerCase(); const actual = C.mesActual();
    const costos = S.db.costos.filter(c => {
      const p = S.ix.periodo.get(c.periodo_id); if (!p) return false;
      return S.vistaEq === 'mes' ? p.mes === S.mes : C.restaCosto(S.ix, c) > 0.009 && p.mes <= actual;
    });

    for (const c of costos) { const g = grupos.get(c.persona_id) || []; g.push(c); grupos.set(c.persona_id, g); }
    const cards = [...grupos.entries()].map(([pid, cs]) => {
      const per = S.ix.persona.get(pid); if (q && !per.nombre.toLowerCase().includes(q)) return '';
      const total = C.sum(cs, c => c.monto), pag = C.sum(cs, c => C.pagadoCosto(S.ix, c.id)), resta = C.r2(total - pag);
      cs.sort((a, b) => S.ix.periodo.get(a.periodo_id).mes.localeCompare(S.ix.periodo.get(b.periodo_id).mes));
      return { resta, html: `<section class="card">

  }

      </section>
      <section class="card"><div class="hd"><h3>Gastos de ${mesLargo(S.mes)}</h3><button class="pill sm" data-a="gasto">Agregar gasto</button></div>
        ${gastosMes.length ? `<div class="list">${gastosMes.map(g => `<div class="row"><div class="grow"><div class="ttl">${esc(g.nombre)}</div><div class="sub">${g.recurrente ? `Todos los meses desde ${mesCorto(g.mes)}${g.hasta ? ' hasta ' + mesCorto(g.hasta) : ''}` : 'Solo este mes'}</div></div><span class="num neg">${fmt2(g.monto)}</span>
          ${g.recurrente ? `<button class="pill sm" data-a="fingasto" data-id="${g.id}">Terminar</button>` : ''}<button class="pill sm danger" data-a="delgasto" data-id="${g.id}">Quitar</button></div>`).join('')}</div>` : `<div class="empty">Sin gastos en ${mesLargo(S.mes)}.</div>`}
      </section>
      <section class="card" style="grid-column:1/-1"><div class="hd"><h3>Retiros y ajustes de caja</h3><button class="pill sm pri" data-a="retirar">Registrar retiro</button></div>
        ${movs.length ? `<div class="list">${(S.verMovs ? movs : movs.slice(0, 6)).map(r => `<div class="row"><div class="grow"><div class="ttl">${r.k === 'retiro' ? esc(r.concepto || 'Retiro') : 'Ajuste de caja' + (r.nota ? ': ' + esc(r.nota) : '')}</div><div class="sub">${fechaCorta(r.fecha)}</div></div><span class="num ${r.k === 'retiro' ? 'ac' : r.monto < 0 ? 'neg' : 'pos'}">${r.k === 'ajuste' && r.monto > 0 ? '+' : ''}${fmt2(r.monto)}</span><button class="pill sm danger" data-a="delmov" data-k="${r.k}" data-id="${r.id}">Deshacer</button></div>`).join('')}${movs.length > 6 ? `<button class="row click" data-a="vermovs" style="width:100%;text-align:left"><div class="grow ac">${S.verMovs ? 'Ver menos' : `Ver los ${movs.length}`}</div></button>` : ''}</div>` : '<div class="empty">Sin retiros todavía.</div>'}
      </section>
    </div>`;
  }
  function formRetiro() {
    const k = C.caja(S.ix);
    modal(`<h3>Registrar retiro</h3><p class="lead">Podés retirar hasta ${fmt2(k.disponible)} sin tocar lo que le debés al equipo (${fmt2(k.reserva)}).</p>
      <form class="f" id="fr"><div class="f2"><label class="fl">Monto $<input class="in" type="number" step="0.01" min="0.01" name="monto" required value="${k.disponible}"></label>
      <label class="fl">Fecha<input class="in" type="date" name="fecha" required value="${hoyISO()}"></label></div>
      <label class="fl">Concepto<input class="in" name="concepto" value="Retiro ${mesCorto(C.mesActual())}"></label><div class="err" id="rerr"></div>
      <div class="btns"><button type="button" class="pill" data-a="cerrarModal">Cancelar</button><button class="pill pri" type="submit">Registrar retiro</button></div></form>`, m => {
      const f = m.querySelector('#fr');
      f.addEventListener('submit', async ev => {
        ev.preventDefault(); const monto = C.r2(+f.monto.value);
        if (monto <= 0) return m.querySelector('#rerr').textContent = 'Ingresá un monto mayor a cero.';
        if (monto > k.disponible + 0.009) return m.querySelector('#rerr').textContent = `Solo podés retirar ${fmt2(k.disponible)}. El resto está reservado para pagarle al equipo.`;
        if (await accion(() => DB.ins('retiros', { monto, fecha: f.fecha.value, concepto: f.concepto.value.trim() }), `Retiro de ${fmt2(monto)} registrado`)) cerrarModal();
      });
    });
  }
  function formAjuste() {
    const k = C.caja(S.ix);
    modal(`<h3>Ajustar caja</h3><p class="lead">Poné cuánta plata tiene hoy el negocio (cuentas y efectivo). El sistema calcula ${fmt2(k.saldo)}; la diferencia queda registrada como ajuste.</p>
      <form class="f" id="fa"><label class="fl">Plata real hoy $<input class="in" type="number" step="0.01" name="real" required></label><span class="hint" id="dif"></span>
      <label class="fl">Nota<input class="in" name="nota" placeholder="Ej: saldo Mercado Pago + efectivo"></label>
      <div class="btns"><button type="button" class="pill" data-a="cerrarModal">Cancelar</button><button class="pill pri" type="submit">Ajustar caja</button></div></form>`, m => {
      const f = m.querySelector('#fa');
      f.real.addEventListener('input', () => { const d = C.r2(+f.real.value - k.saldo); m.querySelector('#dif').textContent = f.real.value === '' ? '' : d === 0 ? 'Coincide con el cálculo.' : `Diferencia: ${d > 0 ? '+' : ''}${fmt2(d)}`; });
      f.addEventListener('submit', async ev => {
        ev.preventDefault(); const d = C.r2(+f.real.value - k.saldo);
        if (d === 0) { cerrarModal(); return toast('La caja ya coincide'); }
        if (await accion(() => DB.ins('ajustes_caja', { monto: d, fecha: hoyISO(), nota: f.nota.value.trim() }), 'Caja ajustada')) cerrarModal();
      });
    });
  }
  function formGasto() {
    modal(`<h3>Agregar gasto</h3><p class="lead">Se descuenta de la ganancia del mes y de la caja.</p>
      <form class="f" id="fg"><div class="f2"><label class="fl">Concepto<input class="in" name="nombre" required placeholder="Ej: CapCut Pro"></label><label class="fl">Monto $<input class="in" type="number" step="0.01" min="0.01" name="monto" required></label></div>
      <div class="f2"><label class="fl">Mes<input class="in" type="month" name="mes" required value="${S.mes}"></label><label class="fl">Frecuencia<select class="in" name="rec"><option value="0">Solo ese mes</option><option value="1">Todos los meses</option></select></label></div>
      <div class="btns"><button type="button" class="pill" data-a="cerrarModal">Cancelar</button><button class="pill pri" type="submit">Agregar gasto</button></div></form>`, m => {
      const f = m.querySelector('#fg');
      f.addEventListener('submit', async ev => {
        ev.preventDefault();
        if (await accion(() => DB.ins('gastos', { nombre: f.nombre.value.trim(), monto: C.r2(+f.monto.value), mes: f.mes.value, recurrente: f.rec.value === '1' }), 'Gasto agregado')) cerrarModal();
      });
    });
  }

  /* ---------- MÉTRICAS ---------- */
  function pKpis() {
    const hasta = S.mes, desde = S.rangoK ? C.addMonths(hasta, -(S.rangoK - 1)) : '0000-00';
    const k = C.kpis(S.ix, desde, hasta); const rv = C.renovaciones(S.ix, S.mes);
    const t = (l, v, d) => `<div class="tile"><div class="t">${l}</div><div class="v num">${v}</div><div class="d mu">${d}</div></div>`;
    const canales = Object.entries(k.canales).sort((a, b) => b[1].ingreso - a[1].ingreso); const totCan = C.sum(canales, c => c[1].clientes) || 1;
    return `<div class="pills mb">${[[3, '3 meses'], [6, '6 meses'], [12, '12 meses'], [0, 'Todo']].map(([v, l]) => `<button class="pill sm${S.rangoK === v ? ' on' : ''}" data-a="rangok" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="tiles mb">${t('Retención', rv.retencion == null ? '—' : pct(rv.retencion), `${rv.anterior - rv.noRenovaron.length} de ${rv.anterior} siguieron en ${MESES[+S.mes.slice(5) - 1]}`)}${t('Meses que dura un cliente', k.vidaMeses.toLocaleString('es-AR', { maximumFractionDigits: 1 }), 'Promedio histórico')}${t('Valor por cliente', fmt(k.ltv), 'Ingreso total promedio')}${t('Ingreso por cliente y mes', fmt(k.ticket), 'En el período')}</div>
    <div class="grid g-2e mb">
      <section class="card"><div class="hd"><h3>No renovaron en ${MESES[+S.mes.slice(5) - 1]}</h3><span class="sub">${rv.noRenovaron.length}</span></div>${listaClientesMini(rv.noRenovaron, 'Todos los del mes anterior siguieron.', 'Estaba el mes anterior')}</section>
      <section class="card"><div class="hd"><h3>Terminan en ${MESES[+S.mes.slice(5) - 1]} sin renovar</h3><span class="sub">${rv.terminanSinRenovar.length}</span></div>${listaClientesMini(rv.terminanSinRenovar, 'Ninguno.', 'Hablales antes de fin de mes')}</section>
    </div>
    <div class="grid g-2 mb">
      <section class="card"><div class="hd"><h3>Equipo</h3><span class="sub">Ingreso que generó cada uno vs lo que cobró</span></div><div class="scroll"><table class="t"><thead><tr><th>Persona</th><th class="r">Videos</th><th class="r">Entregados</th><th class="r">Cobró</th><th class="r">Generó</th><th class="r">Margen</th><th class="r">$ por video</th></tr></thead>
        <tbody>${k.equipo.map(x => `<tr><td>${esc(x.persona?.nombre)}</td><td class="r num">${x.videos}</td><td class="r num">${x.videos ? pct(x.entregados / x.videos) : '—'}</td><td class="r num">${fmt(x.costo)}</td><td class="r num">${fmt(x.ingreso)}</td><td class="r num ${x.margen >= .45 ? 'pos' : x.margen < .35 ? 'neg' : ''}">${pct(x.margen)}</td><td class="r num">${x.videos ? fmt2(C.r2(x.costoVideo)) : '—'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin datos en el período.</td></tr>'}</tbody></table></div></section>
      <section class="card"><div class="hd"><h3>Cómo llegan los clientes</h3></div>${canales.map(([o, v]) => `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><span>${ORIGEN[o === 'sin' ? '' : o] || o}</span><span class="num">${v.clientes} · ${fmt(v.ingreso)}</span></div><div class="bar"><i style="width:${v.clientes / totCan * 100}%"></i></div></div>`).join('')}
        <p class="hint">Completá “Cómo llegó” en cada cliente para que esto sea preciso.</p></section>
    </div>
    <section class="card"><div class="hd"><h3>Clientes que más facturaron</h3><span class="sub">Histórico</span></div><div class="scroll"><table class="t"><thead><tr><th>Cliente</th><th class="r">Meses</th><th class="r">Facturado</th><th>Origen</th><th></th></tr></thead>
      <tbody>${k.clientes.slice(0, 15).map(x => `<tr><td>${esc(x.cliente?.nombre)}</td><td class="r num">${x.meses}</td><td class="r num">${fmt(x.ingreso)}</td><td>${ORIGEN[x.cliente?.origen || '']}</td><td class="r"><button class="icon" style="width:28px;height:28px" data-a="renombrar" data-t="clientes" data-id="${x.cliente?.id}" aria-label="Editar nombre">${ic('lapiz')}</button></td></tr>`).join('')}</tbody></table></div></section>`;
  }

  /* ---------- renombrar / unificar ---------- */
  function formRenombrar(tabla, id) {
    const x = (tabla === 'equipo' ? S.ix.persona : S.ix.cliente).get(id);
    modal(`<h3>Editar nombre</h3><p class="lead">Si escribís el nombre de ${tabla === 'equipo' ? 'otra persona' : 'otro cliente'} que ya existe, se unifican en uno solo.</p>
      <form class="f" id="fn"><label class="fl">Nombre<input class="in" name="nombre" required value="${esc(x.nombre)}" list="dl-n"></label>
      <datalist id="dl-n">${S.db[tabla].filter(y => y.id !== id).map(y => `<option value="${esc(y.nombre)}">`).join('')}</datalist>
      <div class="btns"><button type="button" class="pill" data-a="cerrarModal">Cancelar</button><button class="pill pri" type="submit">Guardar nombre</button></div></form>`, m => {
      m.querySelector('#fn').addEventListener('submit', async ev => {
        ev.preventDefault(); const nombre = ev.target.nombre.value.trim(); if (!nombre || nombre === x.nombre) return cerrarModal();
        const otro = S.db[tabla].find(y => y.id !== id && y.nombre.toLowerCase() === nombre.toLowerCase());
        if (otro) {
          if (!(await confirmar(`¿Unificar “${x.nombre}” con “${otro.nombre}”?`, 'Todo lo de uno pasa al otro. No se puede deshacer.', 'Unificar'))) return;
          await accion(async () => {
            if (tabla === 'equipo') {
              await DB.updWhere('costos', 'persona_id', id, { persona_id: otro.id });
              for (const c of S.db.contratos.filter(c => (c.equipo || []).some(e => e.persona_id === id)))
                await DB.upd('contratos', c.id, { equipo: c.equipo.map(e => e.persona_id === id ? { ...e, persona_id: otro.id } : e) });
            } else await DB.updWhere('contratos', 'cliente_id', id, { cliente_id: otro.id });
            await DB.del(tabla, id);
          }, 'Unificados');
        } else await accion(() => DB.upd(tabla, id, { nombre }), 'Nombre actualizado');
        cerrarModal();
      });
    });
  }

  /* ---------- eventos ---------- */
  async function onClick(e) {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, id = +el.dataset.id;
    if (a !== 'ver') e.stopPropagation();
    switch (a) {
      case 'go': S.page = el.dataset.p; if (el.dataset.v) S.vistaEq = el.dataset.v; cerrarDrawer(); render(); window.scrollTo(0, 0); break;
      case 'mes': S.mes = C.addMonths(S.mes, +el.dataset.d); render(); break;
      case 'setmes': S.mes = el.dataset.m; render(); break;
      case 'nuevo': formContrato(); break;
      case 'ver': if (e.target.closest('[data-stop]')) return; abrirContrato(id); break;
      case 'cerrar': cerrarDrawer(); break;
      case 'cerrarModal': cerrarModal(); break;
      case 'menu': {
        const c = S.ix.contrato.get(id);
        menu(el, [{ t: 'Ver detalle', f: () => abrirContrato(id) }, { t: 'Editar', f: () => formContrato(c, 'editar') }, { t: 'Renovar', f: () => formContrato(c, 'renovar') },
          { t: 'Registrar cobro', f: () => formCobro(id) }, { t: 'Eliminar', neg: true, f: () => eliminarContrato(id) }]);
        break;
      }
      case 'editar': formContrato(S.ix.contrato.get(id), 'editar'); break;
      case 'renovar': formContrato(S.ix.contrato.get(id), 'renovar'); break;
      case 'eliminar': eliminarContrato(id); break;
      case 'cobro': formCobro(id); break;
      case 'delcobro': {
        const x = S.db.cobros.find(c => c.id === id);
        if (await confirmar('¿Deshacer este cobro?', `Se quita ${fmt2(x.monto)} de la caja.`, 'Deshacer cobro', true)) accion(() => DB.del('cobros', id), 'Cobro deshecho');
        break;
      }
      case 'ent': {
        const p = S.ix.periodo.get(+el.dataset.p); const v = Math.max(0, Math.min(p.videos, (p.entregados ?? 0) + +el.dataset.d));
        if (v === (p.entregados ?? 0)) break;
        p.entregados = v; S.ix = C.indexar(S.db); render();
        sync('busy', 'Guardando…');
        DB.upd('periodos', p.id, { entregados: v }).then(() => sync('', 'Sincronizado'))
          .catch(err => { toast('No se guardó la entrega: ' + err.message, true); recargar(['periodos']); });
        break;
      }
      case 'pagar': formPago(+el.dataset.c); break;
      case 'editcosto': formMontoCosto(+el.dataset.c); break;
      case 'revertir': {
        const y = S.db.pagos.find(p => p.id === id); const costoId = y.costo_id;
        if (await confirmar('¿Revertir este pago?', `${fmt2(y.monto)} del ${fechaCorta(y.fecha)} vuelve a quedar como deuda.`, 'Revertir pago', true))
          if (await accion(() => DB.del('pagos', id), 'Pago revertido')) formPago(costoId);
        break;
      }
      case 'tabcli': S.tabCli = el.dataset.v; render(); break;
      case 'vistaeq': S.vistaEq = el.dataset.v; render(); break;
      case 'vermovs': S.verMovs = !S.verMovs; render(); break;
      case 'rangok': S.rangoK = +el.dataset.v; render(); break;
      case 'retirar': formRetiro(); break;
      case 'ajustar': formAjuste(); break;
      case 'gasto': formGasto(); break;
      case 'delgasto': if (await confirmar('¿Quitar este gasto?', 'Deja de descontarse de la ganancia y de la caja.', 'Quitar gasto', true)) accion(() => DB.del('gastos', id), 'Gasto quitado'); break;
      case 'fingasto': accion(() => DB.upd('gastos', id, { hasta: S.mes }), `Se deja de cobrar después de ${mesLargo(S.mes)}`); break;
      case 'delmov': {
        const t = el.dataset.k === 'retiro' ? 'retiros' : 'ajustes_caja';
        if (await confirmar(el.dataset.k === 'retiro' ? '¿Deshacer este retiro?' : '¿Deshacer este ajuste?', 'La caja se recalcula.', 'Deshacer', true)) accion(() => DB.del(t, id), 'Deshecho');
        break;
      }
      case 'renombrar': formRenombrar(el.dataset.t, id); break;
      case 'logout': await DB.logout(); location.reload(); break;
    }
  }

  /* ---------- login y arranque ---------- */
  function pantallaLogin(msg = '') {
    document.body.innerHTML = `<div class="login"><section class="card box"><div class="logo">NXT <span>Media</span></div><p>Entrá con tu mail y contraseña.</p>
      <form class="f" id="fl"><label class="fl">Mail<input class="in" type="email" name="email" autocomplete="username" required></label>
      <label class="fl">Contraseña<input class="in" type="password" name="pass" autocomplete="current-password" required></label>
      <div class="err" id="lerr">${esc(msg)}</div><button class="pill pri" type="submit" style="justify-content:center;height:44px">Entrar</button></form></section></div>`;
    $('#fl').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target; f.querySelector('button').disabled = true;
      try { await DB.login(f.email.value.trim(), f.pass.value); arrancar(); }
      catch { $('#lerr').textContent = 'Mail o contraseña incorrectos.'; f.querySelector('button').disabled = false; }
    });
  }
  async function arrancar() {
    shell();
    document.addEventListener('click', onClick);
    document.addEventListener('change', e => { if (e.target.id === 'mes') { S.mes = e.target.value; render(); } });
    document.addEventListener('input', e => {
      if (e.target.id !== 'q') return; S.q = e.target.value;
      if (S.q && !['clientes', 'equipo'].includes(S.page)) S.page = 'clientes';
      Object.values(S.charts).forEach(c => c.destroy()); S.charts = {};
      const P = { inicio: pInicio, clientes: pClientes, equipo: pEquipo, finanzas: pFinanzas, kpis: pKpis }[S.page];
      $('#page').innerHTML = P(); document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.p === S.page ? 'page' : 'false'));
      $('h2') && ($('h2').textContent = PAGES[S.page]);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.querySelector('.ov')) cerrarModal(); else cerrarDrawer(); } });
    $('#page').innerHTML = '<div class="empty">Cargando tus datos…</div>';
    try {
      const ses = await DB.session(); const yo = ses && await DB.socio(ses.user?.email);
      if (yo) { const [x, y] = saludo(); S.yo = yo.nombre || ses.user.email.split('@')[0]; $('#hola').innerHTML = `${x} ${y},<br><b>${esc(S.yo)}</b>`; }
      if (!yo) { $('#page').innerHTML = '<section class="card"><div class="empty">Tu usuario entró bien, pero no está habilitado para ver los datos. Pedile a tu socio que agregue tu mail en la tabla “socios” de Supabase.</div></section>'; sync('err', 'Sin acceso'); return; }
      await recargar();
    } catch (e) {
      console.error(e); sync('err', 'Sin conexión');
      $('#page').innerHTML = `<section class="card"><div class="empty">No se pudieron cargar los datos: ${esc(e.message)}.<br>Revisá la conexión y recargá la página. No se muestra nada viejo para que no trabajes sobre datos desactualizados.</div></section>`;
    }
  }
  async function boot() {
    try { DB.init(); } catch (e) { document.body.innerHTML = '<div class="login"><div class="empty">No se pudo cargar Supabase. Revisá la conexión.</div></div>'; return; }
    const s = await DB.session(); if (s) arrancar(); else pantallaLogin();
  }
  window.NXT = { S, render };
  boot();
})();
</script>
</body>
</html>
