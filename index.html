<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Agencia CRM</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0a0c;--s1:#111114;--s2:#18181c;--s3:#222228;--b1:#2a2a32;--b2:#3a3a44;--tx:#eeeef4;--mu:rgba(180,180,200,.55);--ac:#7c6af7;--ac2:#a594ff;--gr:#3ecf8e;--gr2:rgba(62,207,142,.12);--am:#f0a429;--am2:rgba(240,164,41,.12);--rd:#f06060;--rd2:rgba(240,96,96,.12);--r:12px;--rs:8px;--nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;overscroll-behavior:none}
.mono{font-family:'JetBrains Mono',monospace}
.shell{display:flex;flex-direction:column;height:100dvh;height:100vh}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px)}
.page{display:none;padding:14px 16px}
.page.active{display:block}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(10,10,12,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b1);display:flex;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--mu);cursor:pointer;transition:color .2s;padding:8px 0;font-family:'Syne',sans-serif}
.nb svg{width:22px;height:22px;stroke-width:1.8;transition:all .2s}
.nb span{font-size:10px;font-weight:600;letter-spacing:.04em}
.nb.active{color:var(--ac2)}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;position:sticky;top:0;z-index:10;background:var(--bg)}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.6px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Syne',sans-serif;white-space:nowrap;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ac);color:#fff}
.btn-ghost{background:var(--s2);color:var(--tx);border:1px solid var(--b1)}
.btn-green{background:var(--gr2);color:var(--gr);border:1px solid rgba(62,207,142,.25)}
.btn-red{background:var(--rd2);color:var(--rd);border:1px solid rgba(240,96,96,.25)}
.btn-am{background:var(--am2);color:var(--am);border:1px solid rgba(240,164,41,.25)}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--rs)}

/* KPI */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi-row.tri{grid-template-columns:1fr 1fr 1fr}
.kpi{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px}
.kpi.full{grid-column:1/-1}
.kpi-label{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-val{font-size:21px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--mu);margin-top:4px}
.c-gr{color:var(--gr)}.c-rd{color:var(--rd)}.c-am{color:var(--am)}.c-ac{color:var(--ac2)}

/* CARD */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;margin-bottom:12px}

/* LIST ITEM */
.li{padding:13px 14px;border-bottom:1px solid var(--b1)}
.li:last-child{border-bottom:none}
.li-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.li-name{font-size:14px;font-weight:600}
.li-sub{font-size:12px;color:var(--mu);margin-top:2px}
.li-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600}
.b-gr{background:var(--gr2);color:var(--gr)}
.b-am{background:var(--am2);color:var(--am)}
.b-rd{background:var(--rd2);color:var(--rd)}
.b-ac{background:rgba(124,106,247,.15);color:var(--ac2)}

/* AVATAR */
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}

/* FILTER CHIPS */
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600;border:1px solid var(--b1);background:var(--s2);color:var(--mu);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:'Syne',sans-serif}
.chip.active{background:rgba(124,106,247,.2);border-color:var(--ac);color:var(--ac2)}

/* DEAL CARD */
.dc{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px;margin-bottom:10px}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.dc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.dc-stat{background:var(--s2);border-radius:var(--rs);padding:8px 10px}
.dc-stat-l{font-size:10px;color:var(--mu);margin-bottom:3px;font-weight:500}
.dc-stat-v{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
.dc-footer{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* SELECT */
.sel{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rs);padding:8px 12px;color:var(--tx);font-size:13px;font-family:'Syne',sans-serif;appearance:none;cursor:pointer}

/* MODAL */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:flex-end}
.mover.open{display:flex}
.modal{background:var(--s1);border-radius:20px 20px 0 0;width:100%;max-height:93dvh;max-height:93vh;overflow-y:auto;padding:20px 16px;padding-bottom:calc(20px + var(--safe-b))}
.mhandle{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 18px}
.mtitle{font-size:17px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.fi{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rs);padding:10px 12px;color:var(--tx);font-size:14px;font-family:'Syne',sans-serif;transition:border .15s}
.fi:focus{outline:none;border-color:var(--ac)}
.fgr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfooter{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--b1)}
.mfooter .btn{flex:1;padding:12px}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--s3);border:1px solid var(--b2);border-radius:100px;padding:10px 20px;font-size:13px;font-weight:600;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--gr);border-color:rgba(62,207,142,.35)}
.toast.err{color:var(--rd);border-color:rgba(240,96,96,.35)}

/* CHART */
.chart{display:flex;align-items:flex-end;gap:8px;height:90px}
.bwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bval{font-size:10px;color:var(--mu);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.bbar{width:100%;border-radius:3px 3px 0 0;min-height:4px}
.blbl{font-size:10px;color:var(--mu)}

/* MISC */
.sec{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.sec:first-child{margin-top:0}
.empty{text-align:center;padding:36px 16px;color:var(--mu);font-size:13px}
.spin{width:24px;height:24px;border:2px solid var(--b2);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px;color:var(--mu);font-size:13px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- MODAL DEAL -->
<div class="mover" id="m-deal">
<div class="modal">
  <div class="mhandle"></div>
  <div class="mtitle" id="m-deal-title">Nuevo deal</div>
  <input type="hidden" id="d-id">
  <div class="fgr">
    <div class="fg"><label>Mes</label><input class="fi" id="d-mes" type="month"></div>
    <div class="fg"><label>Cliente</label><input class="fi" id="d-cliente" placeholder="Nombre"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Editor</label>
      <input class="fi" id="d-editor" list="editor-list" placeholder="Nombre del editor">
      <datalist id="editor-list"></datalist>
    </div>
    <div class="fg"><label>Videos</label><input class="fi" id="d-videos" type="number" min="1" placeholder="0"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Precio base $</label><input class="fi" id="d-precio" type="number" step="0.01" placeholder="0.00"></div>
    <div class="fg"><label>Extras $</label><input class="fi" id="d-extras" type="number" step="0.01" value="0"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Inicio</label><input class="fi" id="d-inicio" type="date"></div>
    <div class="fg"><label>Fin servicio</label><input class="fi" id="d-fin" type="date"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Estado cobro</label>
      <select class="fi sel" id="d-estado">
        <option value="0%">Sin cobrar</option>
        <option value="50%">50% cobrado</option>
        <option value="100%">100% cobrado</option>
      </select>
    </div>
    <div class="fg"><label>Costo/video $ (opcional)</label><input class="fi" id="d-cvideo" type="number" step="0.01" placeholder="Auto"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Costo editor total $ (opcional)</label><input class="fi" id="d-costo-editor" type="number" step="0.01" placeholder="Auto (videos × costo/video)"></div>
    <div class="fg"><label>Link Drive</label><input class="fi" id="d-drive" placeholder="https://..."></div>
  </div>
  <div class="mfooter">
    <button class="btn btn-ghost" onclick="closeModal('m-deal')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveDeal()">Guardar</button>
  </div>
</div>
</div>


<!-- MODAL CONTENIDO -->
<div class="mover" id="m-cont">
<div class="modal">
  <div class="mhandle"></div>
  <div class="mtitle" id="mc-title">Nuevo proyecto</div>
  <input type="hidden" id="mc-id">
  <div class="fgr">
    <div class="fg"><label>Mes</label><input class="fi" id="mc-mes" type="month"></div>
    <div class="fg"><label>Cliente</label><input class="fi" id="mc-cliente" placeholder="Nombre"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Tipo de proyecto</label>
      <select class="fi sel" id="mc-tipo">
        <option>Servicio de contenido</option>
        <option>Guion de video</option>
        <option>Copy para redes</option>
        <option>Estrategia mensual</option>
        <option>Pack copies + estrategia</option>
        <option>Newsletter</option>
        <option>Calendario de contenido</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="fg"><label>Estado</label>
      <select class="fi sel" id="mc-estado">
        <option>En curso</option>
        <option>Entregado</option>
        <option>Pausado</option>
        <option>Cancelado</option>
      </select>
    </div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Copywriter</label><select class="fi sel" id="mc-cw"></select></div>
    <div class="fg"><label>Editor</label><select class="fi sel" id="mc-editor"></select></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Precio cliente $</label><input class="fi" id="mc-precio" type="number" step="0.01" placeholder="0.00"></div>
    <div class="fg"><label>Cash cobrado $</label><input class="fi" id="mc-cobrado" type="number" step="0.01" value="0"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Costo copywriter $</label><input class="fi" id="mc-cw-costo" type="number" step="0.01" placeholder="0.00"></div>
    <div class="fg"><label>Costo editor $</label><input class="fi" id="mc-ed-costo" type="number" step="0.01" placeholder="0.00"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Inicio</label><input class="fi" id="mc-inicio" type="date"></div>
    <div class="fg"><label>Entrega</label><input class="fi" id="mc-entrega" type="date"></div>
  </div>
  <div class="fg"><label>Videos pactados</label><input class="fi" id="mc-videos" type="number" placeholder="0"></div>
  <div class="fg"><label>Notas</label><input class="fi" id="mc-notas" placeholder="Opcional"></div>
  <div class="mfooter">
    <button class="btn btn-ghost" onclick="closeModal('m-cont')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveCont()">Guardar</button>
  </div>
</div>
</div>

<!-- MODAL PAGO CONTENIDO -->
<div class="mover" id="m-pago-cont">
<div class="modal">
  <div class="mhandle"></div>
  <div class="mtitle">Registrar pago mensual</div>
  <input type="hidden" id="mpc-id">
  <div class="fgr">
    <div class="fg"><label>Mes</label><input class="fi" id="mpc-mes" type="month"></div>
    <div class="fg"><label>Destinatario</label><input class="fi" id="mpc-destinatario" placeholder="Nombre"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Rol</label>
      <select class="fi sel" id="mpc-rol">
        <option>Copywriter</option>
        <option>Editor</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="fg"><label>Cliente del proyecto</label><input class="fi" id="mpc-cliente" placeholder="Opcional"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Monto $</label><input class="fi" id="mpc-monto" type="number" step="0.01" placeholder="0.00"></div>
    <div class="fg"><label>Estado</label>
      <select class="fi sel" id="mpc-estado">
        <option>Pendiente</option>
        <option>Pagado</option>
      </select>
    </div>
  </div>
  <div class="fg"><label>Notas</label><input class="fi" id="mpc-notas" placeholder="Mes 1 de 3, etc."></div>
  <div class="mfooter">
    <button class="btn btn-ghost" onclick="closeModal('m-pago-cont')">Cancelar</button>
    <button class="btn btn-primary" onclick="savePagoCont()">Guardar</button>
  </div>
</div>
</div>

<!-- MODAL COBRO -->
<div class="mover" id="m-cobro">
<div class="modal">
  <div class="mhandle"></div>
  <div class="mtitle">Registrar cobro</div>
  <div class="fgr">
    <div class="fg"><label>Fecha</label><input class="fi" id="c-fecha" type="date"></div>
    <div class="fg"><label>Monto $</label><input class="fi" id="c-monto" type="number" step="0.01"></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Cliente</label><input class="fi" id="c-cliente" placeholder="Nombre"></div>
    <div class="fg"><label>Editor</label><select class="fi sel" id="c-editor"></select></div>
  </div>
  <div class="fgr">
    <div class="fg"><label>Mes del deal</label><input class="fi" id="c-mes" type="month"></div>
    <div class="fg"><label>Método</label>
      <select class="fi sel" id="c-metodo">
        <option>Transferencia</option><option>Efectivo</option><option>PayPal</option><option>Crypto</option><option>Otro</option>
      </select>
    </div>
  </div>
  <div class="fg"><label>Concepto</label><input class="fi" id="c-concepto" placeholder="50% inicio..."></div>
  <div class="mfooter">
    <button class="btn btn-ghost" onclick="closeModal('m-cobro')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveCobro()">Guardar</button>
  </div>
</div>
</div>

<!-- APP -->
<div class="shell">
<div class="main" id="main">

  <!-- DASHBOARD -->
  <div id="pg-dash" class="page active">
    <div class="topbar">
      <div class="page-title">Dashboard</div>
      <select class="sel" id="dash-mes" style="padding:7px 10px;font-size:12px" onchange="loadDash()">
        <option value="">Total</option>
      </select>
    </div>
    <div id="dash-c"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  </div>

  <!-- DEALS -->
  <div id="pg-deals" class="page">
    <div class="topbar">
      <div class="page-title">Deals</div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="sel" id="deals-mes-sel" style="padding:7px 10px;font-size:12px" onchange="setDealMesSel(this.value)">
          <option value="">Todos</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openNewDeal()">+ Nuevo</button>
      </div>
    </div>
    <div id="deals-c"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  </div>

  <!-- COBROS -->
  <div id="pg-cobros" class="page">
    <div class="topbar">
      <div class="page-title">Cobros</div>
      <button class="btn btn-primary btn-sm" onclick="openModal('m-cobro')">+ Registrar</button>
    </div>
    <div id="cobros-c"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  </div>

  <!-- CONTENIDO -->
  <div id="pg-cont" class="page">
    <div class="topbar">
      <div class="page-title">Contenido</div>
      <button class="btn btn-primary btn-sm" onclick="openNewCont()">+ Nuevo</button>
    </div>
    <select class="sel" id="cont-mes-sel" style="padding:7px 10px;font-size:12px;margin-bottom:14px;width:auto" onchange="setContMesSel(this.value)">
      <option value="">Todos</option>
    </select>
    <!-- KPIs contenido -->
    <div id="cont-kpis"></div>
    <!-- Deals contenido -->
    <div id="cont-c"><div class="loading"><div class="spin"></div>Cargando...</div></div>
    <!-- Pagos mensuales -->
    <div class="sec" style="margin-top:20px">Pagos mensuales a equipo</div>
    <div id="cont-pagos"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  </div>

  <!-- EDITORES -->
  <div id="pg-edit" class="page">
    <div class="topbar">
      <div class="page-title">Editores</div>
      <select class="sel" id="edit-mes" style="padding:7px 10px;font-size:12px" onchange="loadEdit()">
        <option value="">Todos</option>
      </select>
    </div>
    <div id="edit-c"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nb active" id="nav-dash" onclick="showPage('dash')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="nb" id="nav-deals" onclick="showPage('deals')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>Deals</span>
  </button>
  <button class="nb" id="nav-cobros" onclick="showPage('cobros')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    <span>Cobros</span>
  </button>
  <button class="nb" id="nav-edit" onclick="showPage('edit')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

async function qGet(table,eq={}){
  let q=db().from(table).select('*');
  for(const[k,v]of Object.entries(eq)){
    if(k==='_order'){const[c,d]=v.split('.');q=q.order(c,{ascending:d!=='desc'})}

// Cuando se cambia un deal, actualiza automáticamente el registro en pagos_editores
async function syncPE(dealId, d) {
  try {
    const{data:all}=await db().from('pagos_editores').select('*');
    // Buscar por cliente + mes (el identificador natural del deal)
    const match = (all||[]).find(p=>p.cliente===d.cliente && p.mes===d.mes);
    const payload={
      mes:d.mes, editor:d.editor, cliente:d.cliente,
      videos:d.videos_pactados, costo:d.costo_editor_total,
      fin_servicio:d.fin_servicio,
      estado_pago:d.pago_editor==='Hecho'?'Pagado':'Pendiente'
    };
    if(match){
      await db().from('pagos_editores').update(payload).eq('id',match.id);
    } else {
      await db().from('pagos_editores').insert(payload);
    }
  } catch(e){console.log('syncPE:',e.message)}
}

async function saveDeal(){
  const id=$('d-id').value;
  const mes=$('d-mes').value,cliente=$('d-cliente').value.trim(),editor=$('d-editor').value;
  const videos=parseInt($('d-videos').value)||0;
  const precio_base=parseFloat($('d-precio').value)||0;
  const extras=parseFloat($('d-extras').value)||0;
  const precio_final=precio_base+extras;
  const inicio=$('d-inicio').value||null,fin=$('d-fin').value||null;
  const estado_cobro=$('d-estado').value;
  const costo_ov=parseFloat($('d-cvideo').value)||null;
  const link_drive=$('d-drive').value.trim()||null;
  if(!mes||!cliente||!editor||!videos||!precio_base){toast('Completá los campos obligatorios','err');return}
  const cpv=costo_ov||(videos<=8?9:videos<=16?8:6);
  const costo_editor_manual=parseFloat(document.getElementById('d-costo-editor').value)||null;
  const costo_editor_total=costo_editor_manual||(cpv*videos);
  const ganancia_neta=precio_final-costo_editor_total;
  const margen=precio_final>0?ganancia_neta/precio_final:0;
  const cash_collected=estado_cobro==='100%'?precio_final:estado_cobro==='50%'?precio_final/2:0;
  const cash_pendiente=precio_final-cash_collected;
  const payload={mes,cliente,editor,videos_pactados:videos,precio_base,extras,precio_final,
    inicio_servicio:inicio,fin_servicio:fin,estado_cobro,cash_collected,cash_pendiente,
    costo_por_video:cpv,costo_editor_total,ganancia_neta,margen,link_drive,mes_cierre:fin?fin.slice(0,7):mes};
  try{
    if(id){
      // Obtener pago_editor actual para no resetear
      const cur=await qGet('deals',{_order:'id.asc'});
      const existing=cur.find(d=>d.id===Number(id));
      await qUpd('deals',Number(id),payload);
      // SYNC pagos_editores automáticamente
      await syncPE(Number(id),{...payload,pago_editor:existing?existing.pago_editor:'Pendiente'});
      toast('Deal actualizado ✓');
    } else {
      const data=await qIns('deals',{...payload,pago_editor:'Pendiente'});
      if(data&&data[0])await syncPE(data[0].id,{...payload,pago_editor:'Pendiente'});
      toast('Deal creado ✓');
    }
    closeModal('m-deal');
    await populateMonths();
    loadDeals();
    if(curPage==='edit')loadEdit();
  if(curPage==='cont')loadCont();
  }catch(e){toast('Error: '+e.message,'err')}
}

async function cobrarDeal(id,precio_final,estadoActual){
  try{
    const nuevo=estadoActual==='100%'
      ?{estado_cobro:'50%',cash_collected:precio_final/2,cash_pendiente:precio_final/2}
      :{estado_cobro:'100%',cash_collected:precio_final,cash_pendiente:0};
    await qUpd('deals',id,nuevo);
    toast(estadoActual==='100%'?'Revertido a 50%':'Cobro completo ✓');
    loadDeals();if(curPage==='cobros')loadCobros();

}

async function pagarEditor(dealId,estadoActual){

    loadDeals();if(curPage==='edit')loadEdit();

}

async function cobrarCont(id, precio) {
  try {
    const deals = await qGet('deals_contenido', { _order: 'id.asc' });
    const d = deals.find(x => x.id === id);
    if (!d) return;
    const yaTotal = Number(d.cash_cobrado) >= precio;
    const nuevo = yaTotal
      ? { cash_cobrado: precio/2, pendiente_cobrar: precio/2 }
      : { cash_cobrado: precio, pendiente_cobrar: 0 };
    await qUpd('deals_contenido', id, nuevo);
    toast(yaTotal ? 'Revertido a 50%' : 'Cobro completo ✓');
    loadCont();
  } catch(e) { toast('Error: ' + e.message, 'err'); }
}

  try {
    const nuevo = estadoActual === 'Hecho' ? 'Pendiente' : 'Hecho';
    await qUpd('deals_contenido', id, { pago_copywriter: nuevo });

async function saveCont() {
  const id = document.getElementById('mc-id').value;
  const mes = document.getElementById('mc-mes').value;
  const cliente = document.getElementById('mc-cliente').value.trim();
  const tipo_proyecto = document.getElementById('mc-tipo').value;
  const copywriter = document.getElementById('mc-cw').value;
  const editor = document.getElementById('mc-editor').value;
  const inicio = document.getElementById('mc-inicio').value || null;
  const entrega = document.getElementById('mc-entrega').value || null;
  const estado_proyecto = document.getElementById('mc-estado').value;
  const precio_cliente = parseFloat(document.getElementById('mc-precio').value) || 0;
  const cash_cobrado = parseFloat(document.getElementById('mc-cobrado').value) || 0;
  const costo_copywriter = parseFloat(document.getElementById('mc-cw-costo').value) || 0;
  const costo_editor = parseFloat(document.getElementById('mc-ed-costo').value) || 0;
  const videos_pactados = parseInt(document.getElementById('mc-videos').value) || 0;
  const notas = document.getElementById('mc-notas').value.trim() || null;
  if (!mes || !cliente || !precio_cliente) { toast('Completá los campos obligatorios', 'err'); return; }
  const pendiente_cobrar = precio_cliente - cash_cobrado;
  const ganancia_neta = precio_cliente - costo_copywriter - costo_editor;
  const payload = { mes, cliente, tipo_proyecto, copywriter, editor, inicio, entrega,
    estado_proyecto, precio_cliente, cash_cobrado, pendiente_cobrar,
    costo_copywriter, costo_editor, videos_pactados, ganancia_neta, notas,
    mes_cierre: entrega ? entrega.slice(0,7) : mes };
  try {
    if (id) {
      await qUpd('deals_contenido', Number(id), payload);
      toast('Proyecto actualizado ✓');
    } else {
      await qIns('deals_contenido', { ...payload, pago_copywriter: 'Pendiente', pago_editor: 'Pendiente', ganancia_retirada: 'No' });
      toast('Proyecto creado ✓');
    }
    closeModal('m-cont');
    loadCont();
  } catch(e) { toast('Error: ' + e.message, 'err'); }
}

// ─── DYNAMIC MONTHS ────────────────────────────────────────
const MONTH_NAMES = {
  '01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun',
  '07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'
};

function fmtMes(m) {
  if(!m) return '';
  const[y,mo]=m.split('-');
  return (MONTH_NAMES[mo]||mo)+' '+y.slice(2);
}

async function populateMonths() {
  // Get all unique months from deals
  const deals = await qGet('deals',{_order:'mes.desc'});
  const meses = [...new Set(deals.map(d=>d.mes).filter(Boolean))].sort().reverse();
  
  // Populate dash-mes select
  const dashSel = $('dash-mes');
  const curDash = dashSel.value;
  dashSel.innerHTML = '<option value="">Total</option>' + 
    meses.map(m=>`<option value="${m}" ${m===curDash?'selected':''}>${fmtMes(m)}</option>`).join('');
  if(!curDash && meses[0]) dashSel.value = meses[0]; // default to latest month

  // Populate deals month select - only months that exist in DB
  const dealsSel = $('deals-mes-sel');
  if(dealsSel) {
    dealsSel.innerHTML = '<option value="">Todos</option>' +
      meses.map(m=>'<option value="'+m+'">'+fmtMes(m)+'</option>').join('');
    if(meses[0]) { dealsSel.value = meses[0]; dealsMes = meses[0]; }
  }

  // Populate edit-mes select
  const editSel = $('edit-mes');
  editSel.innerHTML = '<option value="">Todos</option>' +
    meses.map(m=>`<option value="${m}">${fmtMes(m)}</option>`).join('');

  // Populate cont-chips
  const contDeals = await qGet('deals_contenido',{_order:'mes.desc'});
  const contMeses = [...new Set(contDeals.map(d=>d.mes).filter(Boolean))].sort().reverse();
  const contChips = $('cont-chips');
  const contSel = $('cont-mes-sel');
  if(contSel) {
    contSel.innerHTML = '<option value="">Todos</option>' +
      contMeses.map(m=>'<option value="'+m+'">'+fmtMes(m)+'</option>').join('');
  }
}
